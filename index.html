<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enveloppes</title>
<meta name="theme-color" content="#1B2420">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Enveloppes">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#1B2420; color:#F4EFE1; font-family: Georgia, 'Times New Roman', serif;
    padding: 24px 16px 90px; -webkit-tap-highlight-color: transparent; }
  .mono { font-family: 'SF Mono', Consolas, Menlo, monospace; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .sub { font-size: 13px; color:#9C9584; margin: 0 0 20px; }
  .tabs { display:flex; gap:6px; margin-bottom:20px; border-bottom:1px solid #3A4238; overflow-x:auto; }
  .tab { padding:8px 12px; font-size:14px; color:#8B8574; background:none; border:none;
    border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
  .tab.active { color:#F4EFE1; border-bottom-color:#8AA624; }
  .card { background:#F4EFE1; color:#2A2723; border-radius:3px; padding:18px 20px; margin-bottom:14px;
    position:relative; box-shadow:0 4px 10px rgba(0,0,0,.25); }
  .flap { position:absolute; top:0; left:0; right:0; height:22px; opacity:.9;
    clip-path: polygon(0 0, 50% 60%, 100% 0); border-radius:3px 3px 0 0; }
  .label { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:#8B8574; }
  .bignum { font-size:30px; font-weight:700; }
  input { width:100%; background:#EDE6D2; border:1px solid #D8CFB8; border-radius:3px;
    padding:8px 10px; font-size:14px; color:#2A2723; font-family:'SF Mono',Consolas,Menlo,monospace; }
  .row { display:flex; gap:8px; align-items:center; }
  .row-between { display:flex; justify-content:space-between; align-items:center; }
  button.btn { background:#2A2723; color:#F4EFE1; border:none; border-radius:3px; padding:9px 14px;
    font-size:13px; cursor:pointer; font-family:'SF Mono',Consolas,Menlo,monospace; }
  button.ghost { background:transparent; color:#8B8574; border:1px solid #3A4238; border-radius:3px;
    padding:6px 10px; font-size:12px; cursor:pointer; font-family:'SF Mono',Consolas,Menlo,monospace; }
  button.danger { background:transparent; color:#C1502E; border:1px solid #C1502E; border-radius:3px;
    padding:5px 9px; font-size:11px; cursor:pointer; font-family:'SF Mono',Consolas,Menlo,monospace; }
  .divider { height:1px; background:#D8CFB8; margin:12px 0; }
  .track { height:10px; background:#DED4B8; border-radius:5px; overflow:hidden; margin-top:8px; }
  .fill { height:100%; transition:width .3s; }
  .field { margin-bottom:10px; }
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50; }
  .modal { width:100%; max-width:360px; }
  .txline { display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
  .subrow { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #E4DDC8; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Enveloppes</h1>
  <div class="sub mono" id="monthLabel"></div>
  <div class="tabs" id="tabs"></div>
  <div id="content"></div>
</div>
<div id="modalRoot"></div>

<script>
const COLORS = ["#8AA624","#4C8577","#B5651D","#6B5B95","#9C4A4A","#3C6E71","#A67C52","#5B7DB1"];
const uid = () => Math.random().toString(36).slice(2,10);
const eur = n => (Math.round((n+Number.EPSILON)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' \u20ac';
const todayISO = () => new Date().toISOString().slice(0,10);
const monthKey = (d=new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

const DEFAULT_DATA = { incomeSources: [], courseEntries: [], subscriptions: [], envelopes: [], transactions: [] };
function loadData() {
  try {
    const raw = localStorage.getItem('budget-enveloppes-data');
    if (!raw) return structuredClone(DEFAULT_DATA);
    const d = JSON.parse(raw);
    // migration depuis l'ancienne version (un seul champ "income")
    if (d.incomeSources === undefined) {
      d.incomeSources = d.income ? [{ id: uid(), name: 'Revenu', amount: Number(d.income) }] : [];
      delete d.income;
    }
    if (d.courseEntries === undefined) d.courseEntries = [];
    if (d.envelopes) d.envelopes.forEach(e => {
      if (e.rollover === undefined) e.rollover = false;
      if (e.createdMonth === undefined) e.createdMonth = monthKey();
    });
    if (!d.envelopes) d.envelopes = [];
    return d;
  } catch(e) { return structuredClone(DEFAULT_DATA); }
}
function saveData() { localStorage.setItem('budget-enveloppes-data', JSON.stringify(data)); }

let data = loadData();
let tab = 'apercu';
let openEnvelopeId = null;
let editBudgetId = null;
let editIncomeId = null;
let editSubId = null;
let expenseFor = null;
let courseModalOpen = false;

function totalSubs() { return data.subscriptions.reduce((s,x)=>s+Number(x.amount||0),0); }
function totalEnvBudget() { return data.envelopes.reduce((s,x)=>s+Number(x.budget||0),0); }
function totalStableIncome() { return data.incomeSources.reduce((s,x)=>s+Number(x.amount||0),0); }
function monthCourseEntries() { const mk = monthKey(); return data.courseEntries.filter(c=>c.date.slice(0,7)===mk); }
function courseIncomeThisMonth() { return monthCourseEntries().reduce((s,c)=>s+Number(c.amount),0); }
function totalIncome() { return totalStableIncome() + courseIncomeThisMonth(); }
function remainingAfterSubs() { return totalIncome() - totalSubs(); }
function unallocated() { return remainingAfterSubs() - totalEnvBudget(); }
function monthTx() { const mk = monthKey(); return data.transactions.filter(t=>t.date.slice(0,7)===mk); }
function spentByEnvelope(id) { return monthTx().filter(t=>t.envelopeId===id).reduce((s,t)=>s+Number(t.amount),0); }
function totalSpent() { return monthTx().reduce((s,t)=>s+Number(t.amount),0); }
function monthsBetween(fromKey, toKey) {
  const [fy, fm] = fromKey.split('-').map(Number);
  const [ty, tm] = toKey.split('-').map(Number);
  return Math.max(1, (ty*12+tm) - (fy*12+fm) + 1);
}
function envelopeStats(env) {
  const spentThisMonth = spentByEnvelope(env.id);
  if (env.rollover) {
    const months = monthsBetween(env.createdMonth || monthKey(), monthKey());
    const allocated = env.budget * months;
    const spentAllTime = data.transactions.filter(t=>t.envelopeId===env.id).reduce((s,t)=>s+Number(t.amount),0);
    return { allocated, spent: spentAllTime, spentThisMonth, remaining: allocated - spentAllTime, months };
  }
  return { allocated: env.budget, spent: spentThisMonth, spentThisMonth, remaining: env.budget - spentThisMonth, months: 1 };
}

function addSubscription(name, amount) {
  if (!name.trim() || !amount || Number(amount) <= 0) return;
  data.subscriptions.push({ id: uid(), name: name.trim(), amount: Number(amount) });
  saveData(); render();
}
function removeSubscription(id) {
  data.subscriptions = data.subscriptions.filter(s=>s.id!==id);
  saveData(); render();
}
function updateSubscription(id, name, amount) {
  if (!name.trim() || !amount || Number(amount) <= 0) return;
  const s = data.subscriptions.find(x=>x.id===id);
  if (!s) return;
  s.name = name.trim(); s.amount = Number(amount);
  saveData(); editSubId = null; render();
}
function addEnvelope(name, budget, rollover) {
  if (!name.trim() || budget === '' || Number(budget) < 0) return;
  const color = COLORS[data.envelopes.length % COLORS.length];
  data.envelopes.push({ id: uid(), name: name.trim(), budget: Number(budget), color, rollover: !!rollover, createdMonth: monthKey() });
  saveData(); render();
}
function removeEnvelope(id) {
  data.envelopes = data.envelopes.filter(e=>e.id!==id);
  data.transactions = data.transactions.filter(t=>t.envelopeId!==id);
  saveData(); render();
}
function updateEnvelopeBudget(id, newBudget, rollover) {
  if (newBudget === '' || Number(newBudget) < 0) return;
  const env = data.envelopes.find(e=>e.id===id);
  if (!env) return;
  env.budget = Number(newBudget);
  env.rollover = !!rollover;
  saveData(); editBudgetId = null; render();
}
function addTransaction(envelopeId, amount, note) {
  if (!amount || Number(amount) <= 0) return;
  data.transactions.unshift({ id: uid(), envelopeId, amount: Number(amount), note: note.trim(), date: todayISO() });
  saveData(); expenseFor = null; render();
}
function removeTransaction(id) {
  data.transactions = data.transactions.filter(t=>t.id!==id);
  saveData(); render();
}
function addIncomeSource(name, amount) {
  if (!name.trim() || !amount || Number(amount) <= 0) return;
  data.incomeSources.push({ id: uid(), name: name.trim(), amount: Number(amount) });
  saveData(); render();
}
function removeIncomeSource(id) {
  data.incomeSources = data.incomeSources.filter(s=>s.id!==id);
  saveData(); render();
}
function updateIncomeSource(id, name, amount) {
  if (!name.trim() || !amount || Number(amount) <= 0) return;
  const s = data.incomeSources.find(x=>x.id===id);
  if (!s) return;
  s.name = name.trim(); s.amount = Number(amount);
  saveData(); editIncomeId = null; render();
}
function addCourseEntry(amount, note) {
  if (!amount || Number(amount) <= 0) return;
  data.courseEntries.unshift({ id: uid(), amount: Number(amount), note: note.trim(), date: todayISO() });
  saveData(); courseModalOpen = false; render();
}
function removeCourseEntry(id) {
  data.courseEntries = data.courseEntries.filter(c=>c.id!==id);
  saveData(); render();
}

function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

function render() {
  document.getElementById('monthLabel').textContent =
    new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});

  document.getElementById('tabs').innerHTML = [
    ['apercu','Aper\u00e7u'], ['enveloppes','Enveloppes'], ['abonnements','Abonnements'], ['revenu','Revenu']
  ].map(([id,label]) => `<button class="tab ${tab===id?'active':''}" data-tab="${id}">${label}</button>`).join('');

  document.getElementById('content').innerHTML =
    tab === 'apercu' ? renderApercu() :
    tab === 'enveloppes' ? renderEnveloppes() :
    tab === 'abonnements' ? renderAbonnements() :
    renderRevenu();

  renderModal();
  bindEvents();
}

function renderApercu() {
  const rem = remainingAfterSubs(), un = unallocated();
  let html = `
  <div class="card">
    <div class="label">Revenus ce mois-ci</div>
    <div class="bignum mono">${eur(totalIncome())}</div>
    <div class="mono" style="font-size:12px;color:#8B8574;margin-top:2px;">
      dont ${eur(totalStableIncome())} stables + ${eur(courseIncomeThisMonth())} de cours particuliers
    </div>
    <div class="divider"></div>
    <div class="row-between mono" style="font-size:13px;">
      <span>Abonnements (${data.subscriptions.length})</span><span>&minus; ${eur(totalSubs())}</span>
    </div>
    <div class="row-between mono" style="font-size:13px;margin-top:4px;">
      <span>D\u00e9pens\u00e9 ce mois-ci</span><span>&minus; ${eur(totalSpent())}</span>
    </div>
    <div class="divider"></div>
    <div class="label">Disponible apr\u00e8s abonnements</div>
    <div class="bignum mono" style="color:${rem<0?'#C1502E':'#3B6D11'}">${eur(rem)}</div>
    <div class="mono" style="font-size:12px;margin-top:6px;color:${un<0?'#C1502E':'#8B8574'}">
      ${un>=0 ? eur(un)+' non affect\u00e9s \u00e0 une enveloppe' : eur(Math.abs(un))+' de budget enveloppes en trop'}
    </div>
  </div>`;

  if (data.envelopes.length === 0) {
    html += `<div class="card" style="text-align:center;color:#8B8574;">Pas encore d'enveloppes. Va dans l'onglet <strong>Enveloppes</strong> pour en cr\u00e9er une.</div>`;
  } else {
    data.envelopes.forEach(env => {
      const stats = envelopeStats(env);
      const pct = stats.allocated > 0 ? (stats.spent/stats.allocated)*100 : 0;
      const remaining = stats.remaining;
      const barColor = remaining<0 ? '#C1502E' : pct>85 ? '#D98E2B' : '#3FA34D';
      html += `
      <div class="card">
        <div class="flap" style="background:${env.color}"></div>
        <div class="row-between" style="margin-top:10px;">
          <div style="font-size:16px;font-weight:700;">${esc(env.name)}${env.rollover ? ' <span class="mono" style="font-size:11px;color:#8B8574;">(cumulatif)</span>' : ''}</div>
          <button class="ghost" data-quickadd="${env.id}">+ d\u00e9pense</button>
        </div>
        <div class="mono" style="font-size:13px;color:#6B6459;margin-top:2px;">${env.rollover ? eur(stats.spent)+' / '+eur(stats.allocated)+' cumul\u00e9s' : eur(stats.spent)+' / '+eur(env.budget)}</div>
        <div class="track"><div class="fill" style="width:${Math.min(pct,100)}%;background:${barColor}"></div></div>
        <div class="mono" style="font-size:12px;margin-top:6px;color:${remaining<0?'#C1502E':'#3B6D11'}">
          ${remaining>=0 ? eur(remaining)+' restants' : eur(Math.abs(remaining))+' de d\u00e9passement'}
        </div>
      </div>`;
    });
  }
  return html;
}

function renderEnveloppes() {
  const un = unallocated();
  let html = `
  <div class="card">
    <div class="label">Nouvelle enveloppe</div>
    <div class="row" style="margin-top:8px;">
      <input id="envName" placeholder="Nom (ex. Courses)">
      <input id="envBudget" style="width:110px;" placeholder="Budget \u20ac" type="number" min="0" step="0.01">
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#6B6459;">
      <input type="checkbox" id="envRollover" style="width:auto;">
      Cumuler le reste non d\u00e9pens\u00e9 d'un mois sur l'autre
    </label>
    <button class="btn" id="addEnvBtn" style="margin-top:10px;">Ajouter l'enveloppe</button>
    <div class="mono" style="font-size:12px;margin-top:10px;color:${un<0?'#C1502E':'#8B8574'}">
      ${un>=0 ? eur(un)+' restent \u00e0 affecter' : eur(Math.abs(un))+' au-del\u00e0 de ton disponible'}
    </div>
  </div>`;

  data.envelopes.forEach(env => {
    const stats = envelopeStats(env);
    const remaining = stats.remaining;
    const open = openEnvelopeId === env.id;
    const editing = editBudgetId === env.id;
    const txs = monthTx().filter(t=>t.envelopeId===env.id).slice(0,8);
    const budgetLine = env.rollover
      ? `${eur(stats.spentThisMonth)} ce mois-ci \u00b7 ${eur(stats.spent)} / ${eur(stats.allocated)} cumul\u00e9s (${stats.months} mois) \u00b7 ${remaining>=0 ? eur(remaining)+' restants' : 'd\u00e9pass\u00e9 de '+eur(Math.abs(remaining))}`
      : `${eur(stats.spent)} / ${eur(env.budget)} \u00b7 ${remaining>=0 ? eur(remaining)+' restants' : 'd\u00e9pass\u00e9 de '+eur(Math.abs(remaining))}`;
    html += `
    <div class="card">
      <div class="flap" style="background:${env.color}"></div>
      <div class="row-between" style="margin-top:10px;">
        <div>
          <div style="font-size:16px;font-weight:700;">${esc(env.name)}${env.rollover ? ' <span class="mono" style="font-size:11px;color:#8B8574;">(cumulatif)</span>' : ''}</div>
          ${editing ? `
            <div style="margin-top:6px;">
              <div class="row">
                <input id="editBudgetInput-${env.id}" type="number" min="0" step="0.01" value="${env.budget}" style="width:110px;">
                <button class="btn" data-savebudget="${env.id}" style="padding:6px 10px;">OK</button>
                <button class="ghost" data-canceledit="${env.id}" style="padding:6px 10px;">annuler</button>
              </div>
              <label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:#6B6459;">
                <input type="checkbox" id="editRolloverInput-${env.id}" style="width:auto;" ${env.rollover ? 'checked' : ''}>
                Cumuler le reste non d\u00e9pens\u00e9 d'un mois sur l'autre
              </label>
            </div>
          ` : `<div class="mono" style="font-size:12px;color:#6B6459;">${budgetLine}</div>`}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">
          <button class="ghost" data-quickadd="${env.id}">+ d\u00e9pense</button>
          <button class="ghost" data-editbudget="${env.id}">modifier</button>
          <button class="ghost" data-toggle="${env.id}">${open?'masquer':'d\u00e9tail'}</button>
          <button class="danger" data-removeenv="${env.id}">suppr.</button>
        </div>
      </div>
      ${open ? `<div style="margin-top:10px;"><div class="divider"></div>` +
        (txs.length===0 ? `<div style="font-size:12px;color:#8B8574;">Aucune d\u00e9pense ce mois-ci.</div>` :
          txs.map(t=>`<div class="txline mono"><span>${t.date.slice(8,10)}/${t.date.slice(5,7)} \u00b7 ${esc(t.note||'sans note')}</span><span style="display:flex;gap:8px;align-items:center;">${eur(t.amount)}<button class="danger" style="padding:2px 6px;" data-removetx="${t.id}">x</button></span></div>`).join('')
        ) + `</div>` : ''}
    </div>`;
  });
  return html;
}

function renderAbonnements() {
  let html = `
  <div class="card">
    <div class="label">Nouvel abonnement / charge fixe</div>
    <div class="row" style="margin-top:8px;">
      <input id="subName" placeholder="Nom (ex. Loyer, Netflix)">
      <input id="subAmount" style="width:110px;" placeholder="Montant \u20ac" type="number" min="0" step="0.01">
    </div>
    <button class="btn" id="addSubBtn" style="margin-top:10px;">Ajouter</button>
  </div>
  <div class="card">
    <div class="row-between" style="margin-bottom:10px;">
      <div class="label">Total mensuel</div>
      <div class="mono" style="font-weight:700;">${eur(totalSubs())}</div>
    </div>`;
  if (data.subscriptions.length === 0) {
    html += `<div style="font-size:13px;color:#8B8574;">Aucun abonnement enregistr\u00e9.</div>`;
  } else {
    const sorted = [...data.subscriptions].sort((a,b) => Number(b.amount) - Number(a.amount));
    sorted.forEach(s => {
      const editing = editSubId === s.id;
      if (editing) {
        html += `<div class="subrow" style="display:block;">
          <div class="row">
            <input id="editSubName-${s.id}" value="${esc(s.name)}" placeholder="Nom">
            <input id="editSubAmount-${s.id}" style="width:100px;" type="number" min="0" step="0.01" value="${s.amount}">
          </div>
          <div style="display:flex;gap:8px;margin-top:6px;">
            <button class="btn" data-savesub="${s.id}" style="padding:6px 10px;">OK</button>
            <button class="ghost" data-cancelsub="${s.id}" style="padding:6px 10px;">annuler</button>
          </div>
        </div>`;
      } else {
        html += `<div class="subrow">
          <span style="font-size:14px;">${esc(s.name)}</span>
          <span style="display:flex;gap:8px;align-items:center;">
            <span class="mono" style="font-size:14px;">${eur(s.amount)}</span>
            <button class="ghost" data-editsub="${s.id}" style="padding:4px 8px;font-size:11px;">modifier</button>
            <button class="danger" data-removesub="${s.id}">suppr.</button>
          </span>
        </div>`;
      }
    });
  }
  html += `</div>`;
  return html;
}

function renderRevenu() {
  let html = `
  <div class="card">
    <div class="label">Nouveau revenu stable</div>
    <div style="font-size:12px;color:#8B8574;margin-top:4px;">Salaire, CAF, pension... des montants qui reviennent chaque mois.</div>
    <div class="row" style="margin-top:8px;">
      <input id="incSrcName" placeholder="Nom (ex. Salaire, APL)">
      <input id="incSrcAmount" style="width:110px;" placeholder="Montant \u20ac" type="number" min="0" step="0.01">
    </div>
    <button class="btn" id="addIncSrcBtn" style="margin-top:10px;">Ajouter</button>
  </div>

  <div class="card">
    <div class="row-between" style="margin-bottom:10px;">
      <div class="label">Revenus stables</div>
      <div class="mono" style="font-weight:700;">${eur(totalStableIncome())}</div>
    </div>`;
  if (data.incomeSources.length === 0) {
    html += `<div style="font-size:13px;color:#8B8574;">Aucun revenu stable enregistr\u00e9.</div>`;
  } else {
    data.incomeSources.forEach(s => {
      const editing = editIncomeId === s.id;
      if (editing) {
        html += `<div class="subrow" style="display:block;">
          <div class="row">
            <input id="editIncName-${s.id}" value="${esc(s.name)}" placeholder="Nom">
            <input id="editIncAmount-${s.id}" style="width:100px;" type="number" min="0" step="0.01" value="${s.amount}">
          </div>
          <div style="display:flex;gap:8px;margin-top:6px;">
            <button class="btn" data-saveincome="${s.id}" style="padding:6px 10px;">OK</button>
            <button class="ghost" data-cancelincome="${s.id}" style="padding:6px 10px;">annuler</button>
          </div>
        </div>`;
      } else {
        html += `<div class="subrow">
          <span style="font-size:14px;">${esc(s.name)}</span>
          <span style="display:flex;gap:8px;align-items:center;">
            <span class="mono" style="font-size:14px;">${eur(s.amount)}</span>
            <button class="ghost" data-editincome="${s.id}" style="padding:4px 8px;font-size:11px;">modifier</button>
            <button class="danger" data-removeincsrc="${s.id}">suppr.</button>
          </span>
        </div>`;
      }
    });
  }
  html += `</div>`;

  const courseEntries = monthCourseEntries().slice(0, 8);
  html += `
  <div class="card">
    <div class="flap" style="background:#B5651D"></div>
    <div class="row-between" style="margin-top:10px;">
      <div>
        <div style="font-size:16px;font-weight:700;">Cours particuliers</div>
        <div class="mono" style="font-size:12px;color:#6B6459;">${eur(courseIncomeThisMonth())} ce mois-ci</div>
      </div>
      <button class="ghost" id="openCourseModalBtn">+ revenu</button>
    </div>
    <div style="margin-top:10px;">
      <div class="divider"></div>`;
  if (courseEntries.length === 0) {
    html += `<div style="font-size:12px;color:#8B8574;">Aucun cours enregistr\u00e9 ce mois-ci.</div>`;
  } else {
    courseEntries.forEach(c => {
      html += `<div class="txline mono">
        <span>${c.date.slice(8,10)}/${c.date.slice(5,7)} \u00b7 ${esc(c.note||'sans note')}</span>
        <span style="display:flex;gap:8px;align-items:center;">${eur(c.amount)}<button class="danger" style="padding:2px 6px;" data-removecourse="${c.id}">x</button></span>
      </div>`;
    });
  }
  html += `</div></div>`;

  html += `
  <div class="card">
    <div class="row-between mono" style="font-size:13px;">
      <span>Revenus totaux ce mois-ci</span><span>${eur(totalIncome())}</span>
    </div>
    <div class="row-between mono" style="font-size:13px;margin-top:4px;">
      <span>Abonnements</span><span>&minus; ${eur(totalSubs())}</span>
    </div>
    <div class="divider"></div>
    <div class="row-between mono" style="font-size:14px;font-weight:700;">
      <span>Disponible pour les enveloppes</span><span>${eur(remainingAfterSubs())}</span>
    </div>
  </div>`;

  return html;
}

function renderModal() {
  const root = document.getElementById('modalRoot');
  if (courseModalOpen) {
    root.innerHTML = `
    <div class="modal-overlay" id="courseModalOverlay">
      <div class="card modal">
        <div class="flap" style="background:#B5651D"></div>
        <div style="margin-top:10px;font-size:16px;font-weight:700;margin-bottom:12px;">Revenu \u00b7 Cours particuliers</div>
        <div class="field">
          <div class="label" style="margin-bottom:4px;">Montant</div>
          <input id="courseAmount" type="number" min="0" step="0.01" placeholder="0.00" autofocus>
        </div>
        <div class="field">
          <div class="label" style="margin-bottom:4px;">Note (optionnel)</div>
          <input id="courseNote" placeholder="ex. \u00c9l\u00e8ve Lucas, 2h">
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="btn" id="saveCourse">Enregistrer</button>
          <button class="ghost" id="cancelCourse">Annuler</button>
        </div>
      </div>
    </div>`;
    return;
  }
  if (!expenseFor) { root.innerHTML = ''; return; }
  const env = data.envelopes.find(e=>e.id===expenseFor);
  if (!env) { expenseFor = null; root.innerHTML = ''; return; }
  root.innerHTML = `
  <div class="modal-overlay" id="modalOverlay">
    <div class="card modal">
      <div class="flap" style="background:${env.color}"></div>
      <div style="margin-top:10px;font-size:16px;font-weight:700;margin-bottom:12px;">D\u00e9pense \u00b7 ${esc(env.name)}</div>
      <div class="field">
        <div class="label" style="margin-bottom:4px;">Montant</div>
        <input id="txAmount" type="number" min="0" step="0.01" placeholder="0.00" autofocus>
      </div>
      <div class="field">
        <div class="label" style="margin-bottom:4px;">Note (optionnel)</div>
        <input id="txNote" placeholder="ex. Carrefour">
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn" id="saveTx">Enregistrer</button>
        <button class="ghost" id="cancelTx">Annuler</button>
      </div>
    </div>
  </div>`;
}

function bindEvents() {
  document.querySelectorAll('[data-tab]').forEach(el =>
    el.onclick = () => { tab = el.dataset.tab; render(); });

  document.querySelectorAll('[data-quickadd]').forEach(el =>
    el.onclick = () => { expenseFor = el.dataset.quickadd; render(); });

  document.querySelectorAll('[data-toggle]').forEach(el =>
    el.onclick = () => { openEnvelopeId = openEnvelopeId === el.dataset.toggle ? null : el.dataset.toggle; render(); });

  document.querySelectorAll('[data-removeenv]').forEach(el =>
    el.onclick = () => removeEnvelope(el.dataset.removeenv));

  document.querySelectorAll('[data-editbudget]').forEach(el =>
    el.onclick = () => { editBudgetId = el.dataset.editbudget; render(); });

  document.querySelectorAll('[data-canceledit]').forEach(el =>
    el.onclick = () => { editBudgetId = null; render(); });

  document.querySelectorAll('[data-savebudget]').forEach(el =>
    el.onclick = () => {
      const id = el.dataset.savebudget;
      updateEnvelopeBudget(id, document.getElementById('editBudgetInput-' + id).value, document.getElementById('editRolloverInput-' + id).checked);
    });

  document.querySelectorAll('[data-removetx]').forEach(el =>
    el.onclick = () => removeTransaction(el.dataset.removetx));

  document.querySelectorAll('[data-removesub]').forEach(el =>
    el.onclick = () => removeSubscription(el.dataset.removesub));
  document.querySelectorAll('[data-editsub]').forEach(el =>
    el.onclick = () => { editSubId = el.dataset.editsub; render(); });
  document.querySelectorAll('[data-cancelsub]').forEach(el =>
    el.onclick = () => { editSubId = null; render(); });
  document.querySelectorAll('[data-savesub]').forEach(el =>
    el.onclick = () => {
      const id = el.dataset.savesub;
      updateSubscription(id, document.getElementById('editSubName-'+id).value, document.getElementById('editSubAmount-'+id).value);
    });

  const addEnvBtn = document.getElementById('addEnvBtn');
  if (addEnvBtn) addEnvBtn.onclick = () => {
    addEnvelope(document.getElementById('envName').value, document.getElementById('envBudget').value, document.getElementById('envRollover').checked);
  };

  const addSubBtn = document.getElementById('addSubBtn');
  if (addSubBtn) addSubBtn.onclick = () => {
    addSubscription(document.getElementById('subName').value, document.getElementById('subAmount').value);
  };

  const addIncSrcBtn = document.getElementById('addIncSrcBtn');
  if (addIncSrcBtn) addIncSrcBtn.onclick = () => {
    addIncomeSource(document.getElementById('incSrcName').value, document.getElementById('incSrcAmount').value);
  };
  document.querySelectorAll('[data-removeincsrc]').forEach(el =>
    el.onclick = () => removeIncomeSource(el.dataset.removeincsrc));
  document.querySelectorAll('[data-editincome]').forEach(el =>
    el.onclick = () => { editIncomeId = el.dataset.editincome; render(); });
  document.querySelectorAll('[data-cancelincome]').forEach(el =>
    el.onclick = () => { editIncomeId = null; render(); });
  document.querySelectorAll('[data-saveincome]').forEach(el =>
    el.onclick = () => {
      const id = el.dataset.saveincome;
      updateIncomeSource(id, document.getElementById('editIncName-'+id).value, document.getElementById('editIncAmount-'+id).value);
    });

  const openCourseModalBtn = document.getElementById('openCourseModalBtn');
  if (openCourseModalBtn) openCourseModalBtn.onclick = () => { courseModalOpen = true; render(); };
  document.querySelectorAll('[data-removecourse]').forEach(el =>
    el.onclick = () => removeCourseEntry(el.dataset.removecourse));

  const courseOverlay = document.getElementById('courseModalOverlay');
  if (courseOverlay) courseOverlay.onclick = (e) => { if (e.target === courseOverlay) { courseModalOpen = false; render(); } };
  const saveCourse = document.getElementById('saveCourse');
  if (saveCourse) saveCourse.onclick = () => addCourseEntry(document.getElementById('courseAmount').value, document.getElementById('courseNote').value);
  const cancelCourse = document.getElementById('cancelCourse');
  if (cancelCourse) cancelCourse.onclick = () => { courseModalOpen = false; render(); };

  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.onclick = (e) => { if (e.target === overlay) { expenseFor = null; render(); } };
  const saveTx = document.getElementById('saveTx');
  if (saveTx) saveTx.onclick = () => addTransaction(expenseFor, document.getElementById('txAmount').value, document.getElementById('txNote').value);
  const cancelTx = document.getElementById('cancelTx');
  if (cancelTx) cancelTx.onclick = () => { expenseFor = null; render(); };
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
